name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build React app
        run: npm run build
        env:
          CI: false

      - name: Skip Firebase Functions deploy notice
        if: ${{ vars.DEPLOY_FIREBASE_FUNCTIONS != 'true' }}
        run: |
          echo "Skipping Functions deploy because DEPLOY_FIREBASE_FUNCTIONS is not true."
          echo "Enable it after the deploy service account has iam.serviceAccounts.ActAs."

      - name: Prepare Firebase service account
        if: ${{ vars.DEPLOY_FIREBASE_FUNCTIONS == 'true' }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Functions
        if: ${{ vars.DEPLOY_FIREBASE_FUNCTIONS == 'true' }}
        run: npx firebase-tools deploy --only functions --project crazyfox-f7e51 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: crazyfox-f7e51
